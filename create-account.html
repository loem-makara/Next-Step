<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(to right, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 12px;
            background-image: url(photo/photo_2026-10-11_22-10-11.jpg);
            opacity: 1;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .register-icon {
            width: 75px;
            height: 75px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-register {
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <!-- Register Icon -->
        <div class="register-icon">
            <i class="bi bi-person-plus-fill"></i>
        </div>

        <h2 class="text-center fw-bold mb-2">Create Account</h2>

        <p class="text-center text-secondary mb-4">
            Register to get started
        </p>

        <!-- Register Form -->
        <form action="#" method="post">

            <!-- Full Name -->
            <div class="mb-3">
                <label for="fullname" class="form-label">
                    Full Name
                </label>

                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input type="password" class="form-control" id="password" name="password"
                    placeholder="Create a password" minlength="8" required>
                <small class="text-secondary">
                    Password must contain at least 8 characters.
                </small>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                    placeholder="Confirm your password" minlength="8" required>
            </div>

            <!-- Terms -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>

                <label class="form-check-label" for="terms">
                    I agree to the Terms and Conditions
                </label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn btn-primary w-100 btn-register">
                <i class="bi bi-person-check me-2"></i>
                Register
            </button>

            <!-- Login Link -->
            <p class="text-center mt-4 mb-0">
                Already have an account?
                <a href="login.html" class="text-primary text-decoration-none fw-bold">
                    Login
                </a>
            </p>

        </form>
    </div>

</body>

</html>

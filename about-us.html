<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About us</title>
     <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">
    <!-- Your CSS -->
    <link rel="stylesheet" href="asset/css/style.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FONT ICON -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="asset/css/swiper.css">
    <link rel="stylesheet" href="asset/css/theme.min.css">
</head>
<body>
      <!-- ================= NAVBAR ================= -->
     <div id="navbar"></div>

    
     <!-- Footer -->
    <div id="footer"></div>

    
    <!-- ================= JAVASCRIPT ================= -->

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <!-- JavaScript -->
    <script src="components.js"></script>

    <!-- Initialize Swiper -->
    <script>

        var swiper = new Swiper('.mySwiper', {

            spaceBetween: 30,

            centeredSlides: true,

            autoplay: {

                delay: 2500,

                disableOnInteraction: false

            },

            pagination: {

                el: '.swiper-pagination',

                clickable: true

            },

            navigation: {

                nextEl: '.swiper-button-next',

                prevEl: '.swiper-button-prev'

            }

        });

    </script>


    <!-- Bootstrap JS -->
    <!-- ONLY ONE Bootstrap JS -->
    <script src="asset/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>

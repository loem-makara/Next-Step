<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

   <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">
    <!-- Your CSS -->
    <link rel="stylesheet" href="asset/css/style.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FONT ICON -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="asset/css/swiper.css">
    
</head>
<body>
    <div class="container-fluid p-0 position-relative">

        <!-- Background Image -->
        <img src="photo/photo_2026-10-11_22-10-11.jpg"
             alt="Background"
             class="login-bg">

        <!-- Login Form -->
        <div class="login-card position-absolute top-50 start-50 translate-middle">

            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <h2 class="text-center fw-bold mb-2">Welcome Back!</h2>

            <p class="text-center text-secondary mb-4">
                Please login to your account
            </p>

            <form action="#" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email"
                           name="email" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <div class="input-group">
                        <input type="password" class="form-control" id="password"
                               name="password" placeholder="Enter your password" required>

                        <button class="btn btn-outline-secondary" type="button"
                                onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="text-decoration-none">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login
                </button>

                <p class="text-center mt-4 mb-0">
                    Don't have an account?
                    <a href="create-account.html"
                       class="text-primary text-decoration-none fw-bold">
                        Register
                    </a>
                </p>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                password.type = "password";
                eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
            }
        }
    </script>
</body>


</html>

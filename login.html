```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="asset/css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT ICON -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="asset/css/swiper.css">

</head>

<body>

    <div class="container-fluid p-0 position-relative">

        <!-- Background Image -->
        <img src="photo/photo_2026-10-11_22-10-11.jpg"
            alt="Background"
            class="login-bg">

        <!-- Login Form -->
        <div class="login-card position-absolute top-50 start-50 translate-middle">

            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <h2 class="text-center fw-bold mb-2">សូមស្វាគមន៏</h2>

            <p class="text-center text-secondary mb-4">
                សូមចូលគណនីរបស់អ្នក
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="mb-3">
                    <label for="loginEmail" class="form-label">អុីមែល</label>
                    <input type="email" class="form-control" id="loginEmail"
                        name="email" placeholder="បញ្ចូលអុីមែលរបស់អ្នក" required>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">ពាក្យសម្ងាត់</label>

                    <div class="input-group">
                        <input type="password" class="form-control" id="loginPassword"
                            name="password" placeholder="បញ្ចូលពាក្យសម្ងាត់" required>

                        <button class="btn btn-outline-secondary" type="button"
                            onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">
                            ចងចាំខ្ញុំ
                        </label>
                    </div>

                    <a href="forget-password.html" class="text-decoration-none">
                        ភ្លេចពាក្យសម្ងាត់?
                    </a>
                </div>

                <!-- Error Message -->
                <p id="loginError" class="text-danger small"></p>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-100 btn-register">
                    <i class="bi bi-person-check me-2"></i>
                    ចូលគណនី
                </button>

                <!-- Google Login -->
                <div class="text-center my-3">OR</div>

                <button type="button" id="googleLogin"
                    class="btn btn-outline-dark w-100">
                    <i class="bi bi-google me-2"></i>
                    Continue with Google
                </button>

                <p class="text-center mt-4 mb-0">
                    មិនទាន់មានគណនីមែនទេ?
                    <a href="create-account.html"
                        class="text-primary text-decoration-none fw-bold">
                        ចុះឈ្មោះថ្មី
                    </a>
                </p>

            </form>

        </div>
    </div>

    <!-- Show / Hide Password -->
    <script>
        function togglePassword() {

            const password = document.getElementById("loginPassword");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                password.type = "password";
                eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
            }
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="asset/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase Authentication -->
    <script type="module" src="auth.js"></script>

</body>

</html>
```

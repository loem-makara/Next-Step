
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="asset/bootstrap/css/bootstrap.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Kantumruy Pro', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(90deg, #e2e2e2, #c9d6ff);
        }

        .container {
            position: relative;
            width: 850px;
            max-width: 100%;
            height: 600px;
            padding: 0;
            margin: auto;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .container h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .container p {
            font-size: 13px;
            margin: 12px 0;
        }

        /* FORM BOX */

        .form {
            width: 100%;
        }

        .form-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 35px;
            z-index: 1;
            transition: right 0.6s ease-in-out;
        }

        .form-box form {
            width: 100%;
        }

        .form-box.login {
            right: 0;
            visibility: visible;
            z-index: 2;
        }

        .form-box.register {
            right: -50%;
            visibility: hidden;
            pointer-events: none;
            z-index: 1;
        }

        /* ACTIVE REGISTER */

        .container.active .form-box.login {
            right: 50%;
            visibility: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .container.active .form-box.register {
            right: 0;
            visibility: visible;
            pointer-events: auto;
            z-index: 2;
        }

        /* INPUT */

        .input-box {
            position: relative;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: #eee;
            border-radius: 8px;
            border: 1px solid transparent;
            outline: none;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .input-box input:focus {
            border-color: #7494ec;
        }

        .input-box input::placeholder {
            color: #888;
            font-weight: 400;
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
            color: #555;
        }

        .input-box .password-toggle {
            cursor: pointer;
        }

        /* FORGOT PASSWORD */

        .forgot-link {
            margin: -5px 0 15px;
            text-align: right;
        }

        .forgot-link a {
            font-size: 13px;
            color: #333;
            text-decoration: none;
        }

        .forgot-link a:hover {
            color: #7494ec;
        }

        /* BUTTON */

        .btn {
            height: 46px;
            width: 100%;
            background: #7494ec;
            border-radius: 8px;
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 15px;
            color: #fff;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5878d5;
            color: #fff;
        }

        /* SOCIAL ICONS */

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 8px;
            color: #333;
            font-size: 19px;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #7494ec;
            border-color: #7494ec;
            transform: translateY(-3px);
        }

        /* TOGGLE BOX */

        .toggle-box {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .toggle-box::before {
            content: '';
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background: #7494ec;
            border-radius: 150px;
            transition: 1.2s ease-in-out;
        }

        .container.active .toggle-box::before {
            left: 50%;
        }

        .toggle-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 30px;
            transition: 0.6s ease-in-out;
        }

        .toggle-panel h1 {
            font-size: 29px;
        }

        .toggle-panel p {
            margin: 15px 0 20px;
        }

        .toggle-panel .btn {
            width: 150px;
            background: transparent;
            border: 2px solid #fff;
            box-shadow: none;
            pointer-events: auto;
        }

        .toggle-panel .btn:hover {
            background: #fff;
            color: #7494ec;
        }

        .toggle-left {
            left: 0;
            transition-delay: 0.6s;
        }

        .container.active .toggle-left {
            left: -50%;
            transition-delay: 0s;
        }

        .toggle-right {
            right: -50%;
            transition-delay: 0s;
        }

        .container.active .toggle-right {
            right: 0;
            transition-delay: 0.6s;
        }

        /* RESPONSIVE */

        @media screen and (max-width: 650px) {

            body {
                padding: 12px;
            }

            .container {
                height: 720px;
                min-height: 620px;
                max-height: calc(100vh - 24px);
                border-radius: 20px;
            }

            .form-box {
                width: 100%;
                height: 75%;
                padding: 25px 22px;
            }

            .form-box.login {
                top: 25%;
                right: 0;
            }

            .form-box.register {
                top: 100%;
                right: 0;
            }

            .container.active .form-box.login {
                top: 25%;
                right: 0;
            }

            .container.active .form-box.register {
                top: 25%;
                right: 0;
            }

            .container h1 {
                font-size: 27px;
            }

            .input-box {
                margin: 17px 0;
            }

            /* TOGGLE MOBILE */

            .toggle-box::before {
                left: 0;
                top: -270%;
                width: 100%;
                height: 300%;
                border-radius: 20vw;
            }

            .container.active .toggle-box::before {
                left: 0;
                top: 70%;
            }

            .toggle-panel {
                width: 100%;
                height: 25%;
                padding: 12px;
            }

            .toggle-panel h1 {
                font-size: 23px;
            }

            .toggle-panel p {
                margin: 5px 0 10px;
                font-size: 12px;
            }

            .toggle-panel .btn {
                width: 130px;
                height: 38px;
                font-size: 13px;
            }

            .toggle-left {
                top: 0;
                left: 0;
            }

            .container.active .toggle-left {
                top: -25%;
                left: 0;
            }

            .toggle-right {
                right: 0;
                bottom: -25%;
            }

            .container.active .toggle-right {
                right: 0;
                bottom: 0;
            }
        }

        @media screen and (max-width: 380px) {

            .form-box {
                padding: 20px 16px;
            }

            .container h1 {
                font-size: 24px;
            }

            .container p {
                font-size: 12px;
            }

            .input-box input {
                font-size: 13px;
            }

            .social-icons a {
                width: 36px;
                height: 36px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- LOGIN FORM -->
        <div class="form-box login">

            <form action="#" id="loginForm">

                <h1>Login</h1>

                <p>Welcome back! Please login to your account.</p>

                <div class="input-box">
                    <input type="email" name="email"
                        placeholder="Email" autocomplete="email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password"
                        id="loginPassword" placeholder="Password"
                        autocomplete="current-password" required>

                    <i class="bi bi-eye password-toggle"
                        onclick="togglePassword('loginPassword', this)"></i>
                </div>

                <div class="forgot-link">
                    <a href="forget-password.html">Forgot Password?</a>
                </div>

               <a href="index.html"> <button type="submit" class="btn">
                    Login
                </button></a>

                <p class="text-center">
                    or login with social platforms
                </p>

                <div class="social-icons">

                    <a href="#" aria-label="Google">
                        <i class="bi bi-google"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#" aria-label="GitHub">
                        <i class="bi bi-github"></i>
                    </a>

                </div>

            </form>

        </div>

        <!-- REGISTER FORM -->
        <div class="form-box register">

            <form action="#" id="registerForm">

                <h1>Register</h1>

                <p>Create your account to get started.</p>

                <!-- Username -->
                <div class="input-box">
                    <input type="text" name="username"
                        placeholder="Username"
                        autocomplete="username"
                        minlength="3" required>
                    <i class="bi bi-person"></i>
                </div>

                <!-- Email -->
                <div class="input-box">
                    <input type="email" name="email"
                        placeholder="Email"
                        autocomplete="email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <!-- Password -->
                <div class="input-box">
                    <input type="password" name="password"
                        id="registerPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="8" required>

                    <i class="bi bi-eye password-toggle"
                        onclick="togglePassword('registerPassword', this)"></i>
                </div>

                <!-- Confirm Password -->
                <div class="input-box">
                    <input type="password" name="confirmPassword"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password" required>

                    <i class="bi bi-eye password-toggle"
                        onclick="togglePassword('confirmPassword', this)"></i>
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

                <p class="text-center">
                    or register with social platforms
                </p>

                <div class="social-icons">

                    <a href="#" aria-label="Google">
                        <i class="bi bi-google"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#" aria-label="GitHub">
                        <i class="bi bi-github"></i>
                    </a>

                </div>

            </form>

        </div>

        <!-- TOGGLE PANEL -->
        <div class="toggle-box">

            <div class="toggle-panel toggle-left">

                <h1>Hello, Welcome!</h1>

                <p>Don't have an account?</p>

                <button type="button" class="btn register-btn">
                    Register
                </button>

            </div>

            <div class="toggle-panel toggle-right">

                <h1>Welcome Back!</h1>

                <p>Already have an account?</p>

                <button type="button" class="btn login-btn">
                    Login
                </button>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        // SHOW / HIDE PASSWORD
        function togglePassword(inputId, icon) {

            const password = document.getElementById(inputId);

            if (password.type === 'password') {

                password.type = 'text';

                icon.classList.replace('bi-eye', 'bi-eye-slash');

            } else {

                password.type = 'password';

                icon.classList.replace('bi-eye-slash', 'bi-eye');

            }
        }

        // SWITCH LOGIN / REGISTER
        const container = document.querySelector('.container');

        const registerBtn = document.querySelector('.register-btn');

        const loginBtn = document.querySelector('.login-btn');

        registerBtn.addEventListener('click', function () {

            container.classList.add('active');

        });

        loginBtn.addEventListener('click', function () {

            container.classList.remove('active');

        });

        // CONFIRM PASSWORD VALIDATION
        const registerForm = document.getElementById('registerForm');

        const password = document.getElementById('registerPassword');

        const confirmPassword = document.getElementById('confirmPassword');

        function checkPassword() {

            if (confirmPassword.value !== password.value) {

                confirmPassword.setCustomValidity(
                    'Password and Confirm Password do not match.'
                );

            } else {

                confirmPassword.setCustomValidity('');

            }
        }

        password.addEventListener('input', checkPassword);

        confirmPassword.addEventListener('input', checkPassword);

        registerForm.addEventListener('submit', function (event) {

            checkPassword();

            if (!registerForm.checkValidity()) {

                event.preventDefault();

                registerForm.reportValidity();

            } else {

                event.preventDefault();

                alert('Register form validation successful!');

            }

        });

        // LOGIN DEMO
        document.getElementById('loginForm').addEventListener('submit', function (event) {

            event.preventDefault();

            alert('Please connect Firebase Authentication to log in.');

        });

    </script>

    <!-- Bootstrap JS -->
    <script src="asset/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
